version: 2

updates:
  # GitHub uses the npm ecosystem identifier for npm, Yarn, and pnpm manifests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
