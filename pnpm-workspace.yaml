packages:
  - .

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
overrides:
  # ESLint's retained minimatch 3.x dependency permits an affected brace-expansion
  # range. Use the patched implementation until its upstream graph is updated.
  brace-expansion: 5.0.12
  defu: 6.1.7
  esbuild: 0.28.2
  # @eslint/eslintrc still resolves a js-yaml 4.x release with known CPU-DoS issues.
  js-yaml: 4.3.2
  minimatch: 10.2.6
  postcss: 8.5.29
  # Next.js declares a sharp range that still admits releases with libheif and
  # librsvg advisories. Pin the patched release.
  sharp: 0.35.5
  ws: 8.22.0
allowBuilds:
  # These packages ship integrity-pinned platform binaries. Their install
  # scripts are not required for the supported build and include cleanup or
  # fallback mutation paths that violate this repository's archive policy.
  esbuild: false
  sharp: false
  unrs-resolver: false
